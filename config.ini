[DEFAULT]
# Connection type. Currently only OnPremise is supported.
AccessType = OnPremise

# Sign-of-life log interval in minutes. 0 disables the periodic entry.
SignOfLifeLog = 1

# Victron D-Bus device instance of this EV charger.
Deviceinstance = 46

# go-e charger hardware version: 1 = v1, 2 = v2, 3 = v3, 4 = v4
# This driver requires hardware version 3 or newer.
HardwareVersion = 3

# Position of the WALLBOX in the Victron system:
# 0 = AC Output 1
# 1 = AC Input 1
# 2 = AC Input 2
Position = 1

# CRITICAL, ERROR, WARNING, INFO, DEBUG, NOTSET
# ERROR keeps current.log small.
Logging = ERROR


[ONPREMISE]
# IP address or hostname of the go-eCharger.
Host = 192.168.100.4

# Normal polling interval in milliseconds while the charger is online.
# This is independent from the slower offline retry interval below.
PauseBetweenRequests = 5000


[CONNECTION]
# Timeout for HTTP requests to the go-eCharger, in seconds.
HttpTimeout = 2

# Consecutive failed requests before the charger is marked offline.
OfflineFailures = 3

# When offline, only retry after this many seconds.
# This prevents unnecessary CPU/network load when the charger is unavailable.
OfflineRetry = 15


[AUTO_CHARGE]
# House-battery SOC control. This applies ONLY in Victron AUTO mode (/Mode = 1).
# MANUAL mode is never blocked by these SOC limits.
BatterySocControl = true

# Release AUTO charging once house-battery SOC reaches this percentage.
StartSoc = 55

# Block AUTO charging once house-battery SOC falls to this percentage.
# Must be lower than StartSoc. Between StopSoc and StartSoc the previous
# release state is retained (hysteresis).
StopSoc = 50

# Interval in seconds for sending pGrid/pAkku/pPv to the go-e PV controller.
IdsInterval = 5


[PV]
# PV SOURCES USED FOR GO-E SURPLUS CONTROL
# Enable every source that physically exists. Sources can be combined.

# PV connected on the AC input/grid side:
# /Ac/PvOnGrid/L1/Power ... L3/Power
AC_IN_PV = false

# DC-coupled PV, e.g. Victron MPPT:
# /Dc/Pv/Power
DC_PV = false

# PV connected behind the inverter on AC Output:
# /Ac/PvOnOutput/L1/Power ... L3/Power
AC_OUT_PV = true
